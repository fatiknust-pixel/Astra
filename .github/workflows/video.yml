name: Vídeo (narração, imagens, prévia e render)

# A cada alteração no roteiro: gera só a narração das cenas que mudaram, baixa imagens
# que faltam e publica a prévia (Remotion Player). O MP4 só é renderizado quando você
# pede: botão "Run workflow" com "renderizar" marcado, ou "[render]" na mensagem do commit.
on:
  push:
    paths:
      - "conteudo/**"
      - "src/**"
      - "preview/**"
      - "scripts/**"
      - "public/sfx/**"
      - "public/fonts/**"
      - ".github/workflows/video.yml"
  workflow_dispatch:
    inputs:
      renderizar:
        description: "Renderizar o MP4 final"
        type: boolean
        default: true
      video:
        description: "Quais vídeos renderizar (ex.: Bolsonaro, Lula ou 'Lula Bolsonaro')"
        type: string
        default: "Bolsonaro"
      refazer_audio:
        description: "Regerar toda a narração"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          npm ci
          pip install edge-tts==7.3.1
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Narração (voz neural, só cenas alteradas)
        run: |
          FORCAR=""
          if [ "${{ inputs.refazer_audio }}" = "true" ]; then FORCAR="--forcar"; fi
          if ! python3 scripts/gerar_audio.py --motor edge $FORCAR; then
            echo "::warning::edge-tts falhou; usando a voz offline Kokoro"
            pip install kokoro-onnx==0.6.1 soundfile
            mkdir -p modelos/kokoro
            curl -sSL -o modelos/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
            curl -sSL -o modelos/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
            python3 scripts/gerar_audio.py --motor kokoro --modelo modelos/kokoro
          fi

      - name: Imagens (Wikipédia / Wikimedia Commons)
        run: node scripts/baixar-imagens.mjs

      - name: Salvar narração e imagens no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public src/gerado
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza narração e imagens geradas"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Checar tipos
        run: npx tsc --noEmit

      - name: Construir prévia interativa
        run: npm run build:preview

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-preview

      - name: Renderizar MP4
        if: ${{ inputs.renderizar || contains(github.event.head_commit.message, '[render]') }}
        run: |
          npx remotion browser ensure
          VIDEOS="${{ inputs.video }}"
          if [ -z "$VIDEOS" ]; then VIDEOS="Lula Bolsonaro"; fi
          for V in $VIDEOS; do
            npx remotion render src/index.ts "$V" "out/video-$V.mp4" --concurrency=4
          done

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.renderizar || contains(github.event.head_commit.message, '[render]') }}
        with:
          name: video-tiktok-9x16
          path: out/*.mp4

  # Publica a prévia no GitHub Pages (ative em Settings → Pages → Source: GitHub Actions)
  pages:
    needs: video
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
